[project]
name = "sistema-juridico-core-api"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "email-validator>=2.2,<3",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.9,<3",
  "cryptography>=43,<46",
  "httpx>=0.27,<1",
  "pyotp>=2.9,<3",
  "segno>=1.6,<2",
  "pyhanko>=0.25,<1",
  "reportlab>=4.2,<5",
  "boto3>=1.35,<2",
  "pypdf>=5,<6",
  "python-multipart>=0.0.12,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pymongo>=4.10,<5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
